# Release — tagged image build + signed publish.
#
# Trigger: pushing a tag matching `v3.*` (e.g. v3.0.0, v3.0.0-RC1).
# Per-service images publish to:
#   docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/arm-<service>:<tag>
# arm-transcode also publishes its GPU-vendor variants (Dockerfile targets
# `intel` / `amd`) as :<tag>-intel and :<tag>-amd; :<tag> is the base target
# (CPU + NVENC), which is also tagged :<tag>-nvidia so the three vendors are
# named alike. :<tag> and :<tag>-nvidia are the same image (one build, one
# digest, two tags).
#
# `:latest` is NOT set here — it tracks `main` HEAD and is owned by
# publish-main.yml. A release is identified solely by its semver tag.
#
# Each image is:
#   1. Built from services/<service>/Dockerfile (context = repo root); a leg's
#      `dir` overrides the source directory (arm-ui builds from services/ui-neu).
#   2. Pushed by digest.
#   3. Signed via cosign keyless (Sigstore + GitHub OIDC token, no key material).
#   4. SBOM generated by syft and attested via cosign attest.
#
# A release also publishes:
#   - the installer bundle (deploy/build-bundle.sh), attached to the GitHub release
#
# Verify post-publish:
#   cosign verify docker.io/<ns>/arm-backend:<tag> \
#     --certificate-identity=https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag> \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
#
# Required repo configuration (all under secrets, even the namespace —
# could be a `vars.` if not for fork convenience):
#   secrets.DOCKERHUB_USERNAME    — Docker Hub login (username, not email)
#   secrets.DOCKERHUB_TOKEN       — Docker Hub access token (Read & Write scope)
#   secrets.DOCKERHUB_NAMESPACE   — Docker Hub namespace, e.g. "automaticrippingmachine"
name: Release

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read
  id-token: write     # required for cosign keyless signing (OIDC)
  packages: write     # in case GHCR is added later; harmless on Docker Hub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  publish:
    name: tags (${{ matrix.service }}${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `target` picks a Dockerfile stage (empty: the file's last stage, the
        # only one that matters for single-image services); `suffix` is
        # appended to every tag. The transcode image publishes three
        # variants: base (CPU + NVENC), -intel (QSV) and -amd (VAAPI).
        # `dir` (default: the service name) is the services/ subdirectory
        # holding the Dockerfile; the arm-ui image is built from ui-neu.
        include:
          - {service: backend, target: "", suffix: ""}
          - {service: ripper, target: "", suffix: ""}
          - {service: transcode, target: base, suffix: "", alias: "-nvidia"}
          - {service: transcode, target: intel, suffix: "-intel"}
          - {service: transcode, target: amd, suffix: "-amd"}
          - {service: ui, dir: ui-neu, target: "", suffix: ""}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # release.yml's tag rules, verbatim from the real workflow
      - name: Compute image tags (release rules)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: docker.io/example/arm-${{ matrix.service }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=ref,event=tag,suffix=${{ matrix.alias }},enable=${{ matrix.alias != '' }}

      # publish-main.yml's tag rules, verbatim from the real workflow
      - name: Compute image tags (trunk rules)
        id: meta_main
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: docker.io/example/arm-${{ matrix.service }}
          flavor: suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short
            type=raw,value=latest,suffix=${{ matrix.alias }},enable=${{ matrix.alias != '' }}
            type=sha,prefix=main-,format=short,suffix=${{ matrix.alias }},enable=${{ matrix.alias != '' }}

      - name: Show the tags each leg would push
        run: |
          echo "RELEASE_TAGS<<EOF"; echo "${{ steps.meta.outputs.tags }}"; echo "EOF"
          echo "TRUNK_TAGS<<EOF"; echo "${{ steps.meta_main.outputs.tags }}"; echo "EOF"
